# Metadata for the sacred images.
#
# Existence comes from assets/img/cat/ — drop a file in there and it appears on
# the wall immediately. This file only says what is *known* about an image.
#
# Fields
# ------
#   file       required; the filename in assets/img/cat/, exactly.
#   title      shown on the wall, the reveal and the popup.
#   no         the sighting number. Optional: without one, a stable number is
#              derived from the filename, so it never changes on its own.
#   hidden     true keeps the image off the wall, out of the random reveal and
#              out of the popup. It can still be named directly by a teaching.
#   record     what is recorded, as an ordered list. There is no fixed set of
#              fields — an image records whatever it records, under whatever
#              labels suit it, and the panel is simply omitted when the list is
#              empty. To state that something is *unknown*, say so out loud:
#              { label = "Bread", value = "not recorded" }. The popup shows the
#              first three values, so put the telling ones first.
#   testimony  a witness account. Shown with `witness` beneath it.
#   witness    who gave it.
#   depicts    what is literally in the frame. NEVER RENDERED — this is for
#              whoever writes the daily teaching and has to choose a fitting
#              image without being able to look at it. Describe the picture,
#              not the doctrine: subject, mount, colours, setting, mood.
#   keywords   short matching terms, same audience, also never rendered.

[[image]]
  file = "Screenshot_62.png"
  title = "The Rooster Above the Ring Road"
  no = 4102
  depicts = "A grey tabby cat riding a large red rooster through deep space, holding a loaded kebab wrap aloft in one paw. Pink and magenta lasers fire from its eyes. Forked white lightning, a purple starfield, a banded gas giant top right, a dark round shield slung at the rooster's side. Loud, fast, storm-lit."
  keywords = ["rooster", "kebab", "lightning", "storm", "lasers", "speed", "night", "purple"]
  record = [
    { label = "Mount", value = "rooster, at speed" },
    { label = "Carried", value = "one wrap, held aloft" },
    { label = "Weather", value = "lightning, considerable" },
    { label = "Bread", value = "not worn" },
    { label = "Filed", value = "day 847" },
  ]
  testimony = "He passed over the tram depot at some speed. He looked at me. I have not been rude to a road since."
  witness = "Sr. Halina, night shift"

