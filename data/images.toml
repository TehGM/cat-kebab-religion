# Metadata for the sacred images.
#
# Existence comes from static/img/cat/ — drop a file in there and it appears on
# the wall immediately. This file only adds what is *recorded* about an image.
# Anything omitted falls back to "not recorded", which is in character.
#
# Keys: file (required, matches the filename), title, no, position (CSS
# object-position), mount, carried, weather, bread, filed, testimony, witness.

