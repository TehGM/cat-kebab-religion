{{ define "main" }}
  <!-- SCAFFOLD: single page / teaching. Replace with Claude Design. -->
  <article>
    <h1>{{ .Title }}</h1>
    {{ with .Date }}<time datetime="{{ .Format "2006-01-02" }}">{{ .Format "January 2, 2006" }}</time>{{ end }}
    {{ .Content }}
    {{ with .GetTerms "tags" }}
    <ul>
      {{ range . }}<li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}
    </ul>
    {{ end }}
  </article>
{{ end }}
