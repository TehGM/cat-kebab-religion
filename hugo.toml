baseURL = "https://cat-kebab.tehgm.net/"
languageCode = "en-us"
title = "Cat Kebab"
enableRobotsTXT = true

# The daily "teachings" are the primary content, so surface recent ones on lists.
[pagination]
  pagerSize = 10

[params]
  description = "The sacred teachings of the Cat Kebab."

[taxonomies]
  tag = "tags"

[markup]
  # Allow raw HTML in Markdown so custom inline components / shortcodes can emit
  # arbitrary markup where hand-authored articles need it.
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# Main navigation. Sections are wired up here so designs can bind to a stable menu.
[[menu.main]]
  name = "Teachings"
  pageRef = "/teachings"
  weight = 10
[[menu.main]]
  name = "Gallery"
  pageRef = "/gallery"
  weight = 20
[[menu.main]]
  name = "The Faith"
  pageRef = "/faith"
  weight = 30
