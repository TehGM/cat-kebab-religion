# Every word a template prints on its own account: buttons, labels, and the
# defaults a page falls back to when its front matter says nothing. The words
# of a page itself live in its content file; the site's name, motto and 404
# copy live under [languages.*] in hugo.toml.
#
# Keys are camelCase and grouped by where they appear. Every key here must
# exist in every enabled language — the build runs with --printI18nWarnings
# and --panicOnWarning, so a missing one fails the deploy.
#
# `{{ .Count }}` entries with `one`/`other` are plurals: call them with a number
# (`T "key" 3`) or a dict holding Count. Polish needs one/few/many/other.

# --- Navigation (the identifiers of [[menu.main]] in hugo.toml) ------------
menuToday = "Today's Teaching"
menuArchive = "The Archive"
menuImages = "Sacred Images"
menuFaith = "The Faith"
languages = "Languages"

