# Polish. Keys and grouping mirror i18n/en.toml — keep them in step; a key
# missing here fails the build.
#
# Not a word-for-word copy of the English: it should sound like a Polish parish
# notice board that has lost its mind, not like a translation. A teaching is
# "kazanie" (neuter: to kazanie, kazania, kazań).
#
# Polish plurals: one (1), few (2–4, 22–24…), many (5–21, 25…), other (fractions;
# never used here, but go-i18n expects it).

